<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sklep Cha&#322;ki</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
    }

    header {
      background: #8B4513;
      color: #fff;
      padding: 18px 40px;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    header span { font-size: 1rem; font-weight: normal; opacity: 0.8; margin-left: 12px; }

    .shop {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 60px 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
      width: 240px;
      padding: 28px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: transform 0.15s;
    }

    .card:hover { transform: translateY(-4px); }

    .card-img {
      width: 120px;
      height: 140px;
      object-fit: contain;
      border-radius: 8px;
    }

    .card-img-placeholder {
      width: 120px;
      height: 140px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .card h2 { font-size: 1.15rem; color: #333; text-align: center; }

    .card .price {
      font-size: 1.4rem;
      font-weight: bold;
      color: #8B4513;
    }

    .btn {
      background: #8B4513;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #6b3410; }

    /* OVERLAY */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }
    #overlay.active { display: flex; }

    #msg-paczka {
      background: #fff;
      border-radius: 20px;
      padding: 48px 64px;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    /* EGG GAME */
    #egg-game { display: flex; flex-direction: column; align-items: center; gap: 20px; }

    #egg-container {
      cursor: pointer;
      user-select: none;
      width: 260px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #egg-img {
      width: 220px;
      height: 260px;
      object-fit: contain;
      transform-origin: center bottom;
    }

    #egg-hint { color: #fff; font-size: 1.1rem; opacity: 0.85; text-align: center; }
    #click-count { color: #ffd700; font-size: 1rem; }

    /* VIDEO TRAP */
    #video-trap {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #video-trap.active { display: flex; }

    #trap-video {
      width: 85vw;
      height: 75vh;
      max-width: 1280px;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
    }

    #trap-msg {
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      animation: pulse 1.2s ease-in-out infinite;
      user-select: none;
    }

    #fake-close {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: left 0.12s, top 0.12s, right 0.12s, bottom 0.12s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }

    /* SHAKE ANIMATIONS */
    @keyframes shake-light {
      0%,100% { transform: rotate(0deg); }
      20% { transform: rotate(-6deg); }
      40% { transform: rotate(6deg); }
      60% { transform: rotate(-4deg); }
      80% { transform: rotate(4deg); }
    }
    @keyframes shake-medium {
      0%,100% { transform: rotate(0deg) translateX(0); }
      15% { transform: rotate(-10deg) translateX(-6px); }
      30% { transform: rotate(10deg) translateX(6px); }
      45% { transform: rotate(-8deg) translateX(-4px); }
      60% { transform: rotate(8deg) translateX(4px); }
      75% { transform: rotate(-5deg) translateX(-2px); }
      90% { transform: rotate(5deg) translateX(2px); }
    }
    @keyframes shake-hard {
      0%,100% { transform: rotate(0deg) translateX(0) translateY(0); }
      10% { transform: rotate(-15deg) translateX(-10px) translateY(-4px); }
      20% { transform: rotate(15deg) translateX(10px) translateY(4px); }
      30% { transform: rotate(-12deg) translateX(-8px) translateY(-3px); }
      40% { transform: rotate(12deg) translateX(8px) translateY(3px); }
      50% { transform: rotate(-18deg) translateX(-12px) translateY(-5px); }
      60% { transform: rotate(18deg) translateX(12px) translateY(5px); }
      70% { transform: rotate(-10deg) translateX(-6px) translateY(-2px); }
      80% { transform: rotate(10deg) translateX(6px) translateY(2px); }
      90% { transform: rotate(-8deg) translateX(-4px) translateY(-1px); }
    }
    @keyframes hatch-out {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      30% { transform: scale(1.3) rotate(-20deg); opacity: 1; }
      60% { transform: scale(1.5) rotate(20deg); opacity: 0.7; }
      100% { transform: scale(0) rotate(45deg); opacity: 0; }
    }
    .shake-light { animation: shake-light 0.35s ease; }
    .shake-medium { animation: shake-medium 0.35s ease; }
    .shake-hard { animation: shake-hard 0.35s ease; }
    .hatch-out { animation: hatch-out 0.6s ease forwards; }

    /* KETCHUP */
    #ketchup-layer { display:none; position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden; }
    #ketchup-bottle { position:absolute; bottom:10%; left:-160px; font-size:8rem; line-height:1; transition:left 0.8s cubic-bezier(0.22,1,0.36,1); filter:drop-shadow(4px 4px 8px rgba(0,0,0,0.4)); }
    #ketchup-bottle.slide-in { left:40px; }
    #ketchup-bottle.slide-out { left:-160px; }
    .tomato-splat { position:absolute; pointer-events:none; display:flex; flex-direction:column; align-items:center; }
    .tomato-fly { font-size:2.2rem; animation:tomatoFly var(--dur) cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
    .splat-blob { width:var(--size); height:calc(var(--size)*0.55); background:radial-gradient(ellipse at 40% 35%,#ff6b6b,#c0392b 60%,#922b21); border-radius:50% 45% 55% 50%/60% 50% 65% 40%; opacity:0; animation:splatAppear 0.25s ease forwards; animation-delay:var(--dur); position:relative; }
    .drip { width:calc(var(--size)*0.18); background:linear-gradient(to bottom,#c0392b,#922b21); border-radius:0 0 50% 50%; opacity:0; animation:dripDown 1.8s ease-in forwards; animation-delay:calc(var(--dur) + 0.1s); position:absolute; top:90%; left:var(--drip-x); }
    @keyframes tomatoFly { 0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1} 70%{opacity:1} 100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.4);opacity:0} }
    @keyframes splatAppear { 0%{opacity:0;transform:scale(0.3)} 60%{opacity:1;transform:scale(1.15)} 100%{opacity:1;transform:scale(1)} }
    @keyframes dripDown { 0%{opacity:1;height:0} 30%{opacity:1;height:calc(var(--size)*0.5)} 80%{opacity:1;height:calc(var(--size)*1.4)} 100%{opacity:0.6;height:calc(var(--size)*1.6)} }
    @keyframes fadeOutLayer { 0%{opacity:1} 100%{opacity:0} }
    #ketchup-layer.fade-out { animation:fadeOutLayer 0.8s ease forwards; }
  </style>
</head>
<body>

<header>
  Sklep Cha&#322;ki
  <span>&#8212; produkty pierwszej potrzeby</span>
</header>

<div class="shop">
  <div class="card">
    <img src="https://jakubserafin.github.io/jako-chalki/ketchup.png" alt="Ketchup" class="card-img"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="card-img-placeholder" style="background:#fff3cd;display:none;">&#127813;</div>
    <h2>Ketchup Babuni</h2>
    <div class="price">4,99 z&#322;</div>
    <button class="btn" onclick="buyKetchup()">Dodaj do koszyka</button>
  </div>

  <div class="card">
    <img src="https://jakubserafin.github.io/jako-chalki/musztarda.png" alt="Musztarda" class="card-img"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="card-img-placeholder" style="background:#fffde7;display:none;">&#127993;</div>
    <h2>Musztarda Sarepska</h2>
    <div class="price">3,49 z&#322;</div>
    <button class="btn" onclick="buySimple()">Dodaj do koszyka</button>
  </div>

  <div class="card">
    <img src="https://jakubserafin.github.io/jako-chalki/jajo.jpeg" alt="Jajo Cha&#322;ki" class="card-img"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="card-img-placeholder" style="background:#fef9f0;display:none;">&#129370;</div>
    <h2>Jajo Cha&#322;ki</h2>
    <div class="price">9,99 z&#322;</div>
    <button class="btn" onclick="buyEgg()">Dodaj do koszyka</button>
  </div>
</div>

<div id="ketchup-layer">
  <div id="ketchup-bottle">&#127870;</div>
</div>

<div id="overlay">
  <div id="msg-paczka" style="display:none;">
    &#128230; Paczka ju&#380; jedzie!
    <div style="font-size:1rem;font-weight:normal;margin-top:12px;color:#666;">Dzi&#281;kujemy za zakup!</div>
    <button class="btn" style="margin-top:24px;font-size:0.9rem;" onclick="closeOverlay()">Zamknij</button>
  </div>

  <div id="egg-game" style="display:none;">
    <div id="egg-hint">Kliknij w jajko, &#380;eby je wyklu&#263;!</div>
    <div id="egg-container" onclick="clickEgg()">
      <img id="egg-img"
           src="https://jakubserafin.github.io/jako-chalki/jajo.jpeg"
           alt="Jajo Cha&#322;ki"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 240%22><ellipse cx=%22100%22 cy=%22120%22 rx=%2280%22 ry=%22110%22 fill=%22%23f5f0d8%22/></svg>'">
    </div>
    <div id="click-count">Klikni&#281;cia: 0 / 10</div>
  </div>
</div>

<!-- PULAPKA WIDEO – nie mozna wyjsc -->
<div id="video-trap">
  <video id="trap-video" autoplay loop playsinline>
    <source src="trap.mp4" type="video/mp4">
  </video>
  <p id="trap-msg">&#128520; NIE MO&#379;ESZ ST&#260;D WYJ&#346;&#262;! &#128520;</p>
  <button id="fake-close">Zamknij [X]</button>
</div>

<script>
  // ============================================================
  // MAKSYMALNA BLOKADA WYJSCIA – styl ptoszek.pl
  // ============================================================

  // 1. Stale wypychaj stan historii co 500ms – cofanie prawie niemozliwe
  history.pushState(null, null, location.href);
  window.addEventListener('popstate', function() {
    history.pushState(null, null, location.href);
  });
  setInterval(function() {
    history.pushState(null, null, location.href);
  }, 500);

  // 2. beforeunload – dialog + otworz nowe okno gdyby uciekl
  window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
    try { window.open(location.href, '_blank'); } catch(err) {}
    return '';
  });

  // 3. Ciagle przejmuj focus (jak ptoszek.pl)
  setInterval(function() {
    try { window.focus(); } catch(err) {}
  }, 300);
  window.addEventListener('blur', function() {
    setTimeout(function() {
      try { window.focus(); } catch(err) {}
    }, 50);
  });
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      setTimeout(function() {
        try { window.focus(); } catch(err) {}
      }, 50);
    }
  });

  // 4. Blokada prawego przycisku
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // 5. Blokada skrotow klawiszowych
  document.addEventListener('keydown', function(e) {
    var blocked =
      e.key === 'F5' ||
      e.key === 'F12' ||
      (e.ctrlKey && ['r','R','w','W','u','U','s','S'].includes(e.key)) ||
      (e.ctrlKey && e.key === 'F4') ||
      (e.ctrlKey && e.shiftKey && ['i','I','j','J','c','C','k','K','m','M'].includes(e.key));
    if (blocked) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  // ============================================================
  // FAKE CLOSE – przycisk ucieka spod kursora
  // ============================================================
  var fakeBtn = document.getElementById('fake-close');
  fakeBtn.addEventListener('mousemove', function(e) {
    var r = fakeBtn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var dist = Math.sqrt(Math.pow(e.clientX - cx, 2) + Math.pow(e.clientY - cy, 2));
    if (dist < 100) {
      var nx = Math.random() * (window.innerWidth - 160) + 40;
      var ny = Math.random() * (window.innerHeight - 60) + 20;
      fakeBtn.style.left = nx + 'px';
      fakeBtn.style.top = ny + 'px';
      fakeBtn.style.right = 'auto';
      fakeBtn.style.bottom = 'auto';
    }
  });
  fakeBtn.addEventListener('click', function() {
    // klikniecie resetuje wideo
    var v = document.getElementById('trap-video');
    v.currentTime = 0;
    v.play();
  });

  // ============================================================
  // SKLEP
  // ============================================================
  var ketchupTimeout = null;

  function buySimple() {
    document.getElementById('overlay').classList.add('active');
    document.getElementById('msg-paczka').style.display = 'block';
    document.getElementById('egg-game').style.display = 'none';
  }

  function buyKetchup() {
    buySimple();
    if (ketchupTimeout) clearTimeout(ketchupTimeout);
    ketchupTimeout = setTimeout(launchKetchupAttack, 15000);
  }

  function launchKetchupAttack() {
    var layer = document.getElementById('ketchup-layer');
    var bottle = document.getElementById('ketchup-bottle');
    layer.style.display = 'block';
    layer.classList.remove('fade-out');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { bottle.classList.add('slide-in'); });
    });
    setTimeout(function() {
      for (var i = 0; i < 12; i++) {
        (function(idx) {
          setTimeout(function() { throwTomato(layer, bottle); }, idx * 280);
        })(i);
      }
    }, 900);
    setTimeout(function() {
      bottle.classList.remove('slide-in');
      bottle.classList.add('slide-out');
      layer.classList.add('fade-out');
      layer.addEventListener('animationend', function() {
        layer.style.display = 'none';
        layer.classList.remove('fade-out');
        bottle.classList.remove('slide-out');
        layer.querySelectorAll('.tomato-splat').forEach(function(el) { el.remove(); });
      }, { once: true });
    }, 900 + 5000);
  }

  function throwTomato(layer, bottle) {
    var br = bottle.getBoundingClientRect();
    var sx = br.right - 20, sy = br.top + br.height * 0.3;
    var tx = (Math.random() * window.innerWidth * 0.75 + window.innerWidth * 0.1) - sx;
    var ty = (Math.random() * window.innerHeight * 0.7 + window.innerHeight * 0.05) - sy;
    var rot = (Math.random() - 0.5) * 720;
    var dur = (0.55 + Math.random() * 0.35).toFixed(2) + 's';
    var size = (60 + Math.random() * 50) + 'px';
    var splat = document.createElement('div');
    splat.className = 'tomato-splat';
    splat.style.left = sx + 'px'; splat.style.top = sy + 'px';
    var fly = document.createElement('span');
    fly.textContent = '🍅';
    fly.className = 'tomato-fly';
    fly.style.setProperty('--tx', tx + 'px');
    fly.style.setProperty('--ty', ty + 'px');
    fly.style.setProperty('--rot', rot + 'deg');
    fly.style.setProperty('--dur', dur);
    var blob = document.createElement('div');
    blob.className = 'splat-blob';
    blob.style.setProperty('--size', size);
    blob.style.setProperty('--dur', dur);
    blob.style.left = (sx + tx - parseFloat(size) / 2) + 'px';
    blob.style.top = (sy + ty) + 'px';
    blob.style.position = 'absolute';
    var drips = 2 + Math.floor(Math.random() * 2);
    for (var d = 0; d < drips; d++) {
      var drip = document.createElement('div');
      drip.className = 'drip';
      drip.style.setProperty('--size', size);
      drip.style.setProperty('--dur', dur);
      drip.style.setProperty('--drip-x', (20 + Math.random() * 60) + '%');
      blob.appendChild(drip);
    }
    splat.appendChild(fly);
    layer.appendChild(splat);
    layer.appendChild(blob);
  }

  // ============================================================
  // JAJO
  // ============================================================
  var clickCount = 0, lastClickTime = 0, rapidStreak = 0;

  function buyEgg() {
    clickCount = 0; rapidStreak = 0; lastClickTime = 0;
    document.getElementById('click-count').textContent = 'Kliknięcia: 0 / 10';
    document.getElementById('egg-hint').textContent = 'Kliknij w jajko, żeby je wykluć!';
    var egg = document.getElementById('egg-img');
    egg.className = '';
    egg.style.display = 'block';
    document.getElementById('overlay').classList.add('active');
    document.getElementById('msg-paczka').style.display = 'none';
    document.getElementById('egg-game').style.display = 'flex';
  }

  function clickEgg() {
    var now = Date.now();
    if (now - lastClickTime < 500) {
      rapidStreak = Math.min(rapidStreak + 1, 5);
    } else {
      rapidStreak = Math.max(rapidStreak - 1, 0);
    }
    lastClickTime = now;
    clickCount++;
    document.getElementById('click-count').textContent = 'Kliknięcia: ' + clickCount + ' / 10';
    var egg = document.getElementById('egg-img');
    egg.classList.remove('shake-light', 'shake-medium', 'shake-hard', 'hatch-out');
    if (clickCount >= 10) {
      egg.classList.add('hatch-out');
      egg.addEventListener('animationend', activateTrap, { once: true });
      return;
    }
    void egg.offsetWidth;
    if (rapidStreak >= 4) {
      egg.classList.add('shake-hard');
      document.getElementById('egg-hint').textContent = '💥 SZALEJE!';
    } else if (rapidStreak >= 2) {
      egg.classList.add('shake-medium');
      document.getElementById('egg-hint').textContent = '🔥 Szybciej!';
    } else {
      egg.classList.add('shake-light');
      document.getElementById('egg-hint').textContent = 'Kliknij w jajko, żeby je wykluć!';
    }
    egg.addEventListener('animationend', function() {
      egg.classList.remove('shake-light', 'shake-medium', 'shake-hard');
    }, { once: true });
  }

  function activateTrap() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('egg-game').style.display = 'none';
    var trap = document.getElementById('video-trap');
    trap.classList.add('active');
    var v = document.getElementById('trap-video');
    v.play().catch(function() {});
    // Pelny ekran
    if (trap.requestFullscreen) {
      trap.requestFullscreen().catch(function() {});
    } else if (trap.webkitRequestFullscreen) {
      trap.webkitRequestFullscreen();
    }
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('msg-paczka').style.display = 'none';
    document.getElementById('egg-game').style.display = 'none';
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeOverlay();
  });
</script>
</body>
</html>
