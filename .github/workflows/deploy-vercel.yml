name: Deploy jako-chalki to Vercel

on:
  push:
    branches:
      - claude/jako-chalki-submodule-Vdscm
    paths:
      - 'jako-chalki/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_0xXCTc8zAtdPiKGgB2TnRoa2
          VERCEL_PROJECT_ID: prj_ocxIzeedSmFXtwdTWtGnifv70vX5
